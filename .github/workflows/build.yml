name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove runner paths from Rust binaries
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build-home --remap-path-prefix=$GITHUB_WORKSPACE=/workspace" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

  release:
    name: Build ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS
            args: "--bundles app,dmg"
          - platform: windows-latest
            label: Windows
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Remove runner paths from Rust binaries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build-home --remap-path-prefix=$GITHUB_WORKSPACE=/workspace" >> "$GITHUB_ENV"
      - name: Remove runner paths from Rust binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=--remap-path-prefix=$env:USERPROFILE=/build-home --remap-path-prefix=$env:GITHUB_WORKSPACE=/workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "v__VERSION__"
          releaseName: "工作日志 Worknote v__VERSION__"
          releaseBody: |
            Worknote v__VERSION__ 是一款免费开源、本地优先的今日任务清单。

            本版新增完整中英文界面切换；顶部日期、统计和新增区域在滚动时保持固定；快速记录在已有任务时默认收起；窗口模式文案与中英文按钮布局更加清晰。

            This release adds a complete Chinese/English interface, a compact sticky workspace, an on-demand quick-entry panel, and clearer window-mode controls.

            macOS：推荐下载 DMG。打开后，请将“工作日志 Worknote”拖到“Applications / 应用程序”文件夹，再从应用程序中启动。只打开 DMG 不等于已经安装。当前公开版尚未经过 Apple 公证；若首次启动提示“Apple 无法验证”，请确认文件来自本仓库，然后前往“系统设置”→“隐私与安全性”→“仍要打开”。
            Windows：下载 setup.exe 并按提示完成安装。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
