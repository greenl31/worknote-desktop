[package]
name = "worknote"
version = "0.5.0"
description = "工作日志 Worknote - 本地优先的今日任务清单"
authors = ["greenl31"]
license = "MIT"
repository = "https://github.com/greenl31/worknote-desktop"
homepage = "https://github.com/greenl31/worknote-desktop"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
